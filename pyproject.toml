[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "quantum-playground-studio"
version = "9.1.0"
description = "Over-engineered quantum computing playground: simulators, 32 runnable experiments with tutors, a full Enigma lab (classical + Grover), and IBM Quantum / AWS Braket cloud execution."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Quantum Playground contributors" }]
keywords = ["quantum", "qiskit", "ibm-quantum", "enigma", "grover", "education"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Physics",
    "Intended Audience :: Education",
]
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
qiskit = ["qiskit>=1.3"]
aer = ["qiskit>=1.3", "qiskit-aer>=0.15"]
ibm = ["qiskit>=1.3", "qiskit-aer>=0.15", "qiskit-ibm-runtime>=0.30"]
braket = ["qiskit>=1.3", "amazon-braket-sdk>=1.80"]
test = ["pytest>=7"]
all = [
    "qiskit>=1.3",
    "qiskit-aer>=0.15",
    "qiskit-ibm-runtime>=0.30",
    "networkx>=3.0",
    "pytest>=7",
]

[project.scripts]
qplay = "quantum_playground.cli.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
quantum_playground = ["web/static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "qiskit: requires qiskit",
    "aer: requires qiskit-aer",
    "ibm: requires qiskit-ibm-runtime (fake backends, no network)",
    "slow: slower end-to-end tests",
]
